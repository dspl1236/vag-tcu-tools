[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vag-tcu-tools"
version = "0.3.0"
description = "Multi-platform VAG transmission firmware toolkit (DQ381, ZF 8HP)"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.17.5",   # pinned: `ruff check .` default rules drift across releases
]

[tool.setuptools.packages.find]
include = ["core*", "platforms*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
